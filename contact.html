<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>お問い合わせ | カフェナビ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/contact.css" />
</head>
<body>
  <main class="contact-wrap">
    <a class="back-link" href="index.html">← 検索ページへ戻る</a>

    <section class="contact-card" aria-label="お問い合わせフォーム">
      <p class="section-badge">Contact</p>
      <h1>お問い合わせフォーム</h1>
      <p class="lead">ご質問・ご要望・不具合報告などがありましたら、以下のフォームからお送りください。</p>

      <form class="contact-form" action="#" method="post">
        <label for="name">お名前</label>
        <input id="name" name="name" type="text" required placeholder="例: 山田 太郎" />

        <label for="email">メールアドレス</label>
        <input id="email" name="email" type="email" required placeholder="example@mail.com" />

        <label for="category">お問い合わせ種別</label>
        <select id="category" name="category" required>
          <option value="" selected disabled>選択してください</option>
          <option value="service">サービスについて</option>
          <option value="bug">不具合報告</option>
          <option value="request">機能要望</option>
          <option value="other">その他</option>
        </select>

        <label for="message">お問い合わせ内容</label>
        <textarea id="message" name="message" rows="7" required placeholder="内容をご記入ください"></textarea>

        <div class="form-actions">
          <button type="submit">送信する</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
